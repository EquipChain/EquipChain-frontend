services:
  stellar:
    image: stellar/quickstart:testing
    command: ["--local", "--enable-stellar-rpc"]
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8000/rpc -O- --header='Content-Type: application/json' --post-data='{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getHealth\"}' | grep -q healthy",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
